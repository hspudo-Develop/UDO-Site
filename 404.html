<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Error 404</title>
    
    <!-- Fuentes corporativas UDO -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           🎨 VARIABLES GLOBALES DE MARCA UDO
           ========================================== */
        :root {
            --udo-azul: #1167a4;
            --udo-azul-oscuro: #0b4b7a;
            --udo-amarillo: #f6b01c;
            --udo-amarillo-oscuro: rgb(252, 176, 24);
            --udo-gris: #a0a09f;
        }

        /* Reseteo básico y Body */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #F8F8F8;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* 💧 MARCA DE AGUA GLOBAL (FONDO INCLINADO) */
        body::before {
            content: "";
            position: fixed; 
            top: 0;
            left: 0;
            width: 120vw;
            height: 120vh;
            margin-top: -10vh;
            margin-left: -10vw;
            background-image: url('https://raw.githubusercontent.com/hspudo-Develop/Repo_IMG_HSP_Coquimbo/refs/heads/main/Sub_Logo-removebg-preview.png');
            background-repeat: no-repeat;
            background-position: center center; 
            background-size: 50%; 
            opacity: 0.60; 
            z-index: -10; 
            pointer-events: none; 
            transform: rotate(10deg); 
            transform-origin: center center; 
        }


        .error-udo-section {
            padding: 100px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ocupa toda la pantalla para centrar la tarjeta */
            background: transparent; 
        }

        /* Tarjeta principal blanca idéntica a manual-card */
        .error-udo-card {
            background: #FFFFFF; 
            border-radius: 24px; 
            padding: 50px 40px;
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.05); 
            border-top: 6px solid var(--udo-amarillo); 
            text-align: center;
            max-width: 550px;
            width: 100%;
            font-family: 'Source Sans 3', sans-serif; 
        }

        /* Área de encabezado con viñeta circular */
        .error-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .error-bullet {
            width: 16px;
            height: 16px;
            background: var(--udo-amarillo); 
            border-radius: 50%; 
            flex-shrink: 0;
        }

        .error-title-area h2 {
            margin: 0;
            font-family: 'Poppins', sans-serif; 
            font-size: 22px;
            color: var(--udo-gris); 
            font-weight: 600;
        }

        /* Número gigante del error */
        .error-code {
            font-family: 'Poppins', sans-serif; 
            font-size: 110px;
            font-weight: 700;
            color: var(--udo-azul); 
            line-height: 1;
            margin: 0 0 15px 0;
            letter-spacing: -2px;
        }

        .error-subtitle {
            font-family: 'Poppins', sans-serif; 
            font-size: 26px;
            color: var(--udo-amarillo-oscuro); 
            font-weight: 600;
            margin-bottom: 15px;
        }

        .error-text {
            font-size: 18px;
            color: #4F5B6B; 
            line-height: 1.7; 
            margin-bottom: 40px;
        }

        /* Botón basado estrictamente en la clase .submit-btn */
        .udo-btn-volver {
            display: inline-block;
            background: var(--udo-azul); 
            color: #FFFFFF; 
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 600; 
            font-family: 'Poppins', sans-serif; 
            box-shadow: 0 4px 12px rgba(17, 103, 164, 0.18); 
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease; 
        }

        .udo-btn-volver:hover {
            background: var(--udo-azul-oscuro); 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(17, 103, 164, 0.3); 
        }

        .udo-btn-volver:active {
            transform: translateY(0); 
        }

        /* Diseño Responsivo para Celulares */
        @media (max-width: 768px) {
            .error-udo-section {
                padding: 60px 20px;
            }
            
            .error-udo-card {
                padding: 40px 25px;
            }

            .error-code {
                font-size: 80px;
            }

            .error-subtitle {
                font-size: 22px;
            }

            .error-text {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <section class="error-udo-section">
        <div class="error-udo-card">
            
            <!-- Área del encabezado con estilo de viñeta -->
            <div class="error-title-area">
                <div class="error-bullet"></div>
                <h2>Error de Navegación</h2>
            </div>
            
            <!-- Código gigante del error -->
            <h1 class="error-code">404</h1>
            
            <!-- Mensaje amigable -->
            <h3 class="error-subtitle">¡Vaya! Te has perdido.</h3>
            <p class="error-text">
                El documento o la página que buscas no existe en el sistema, ha sido movida o escribiste mal la dirección.
            </p>
            
            <!-- Botón de regreso con estilo premium UDO -->
            <a href="index.html" class="udo-btn-volver">Volver al Inicio</a>
            
        </div>
    </section>

</body>
</html>
